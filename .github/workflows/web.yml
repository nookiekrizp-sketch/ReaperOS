name: Publish ReaperOS web app (iPhone & iPad)

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # refresh IMDb, Billboard and YouTube rows
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/. _site/
          cp web/* _site/
          touch _site/.nojekyll

      - name: Refresh charts (IMDb, Billboard Hot 100, modder YouTubers)
        continue-on-error: true
        run: |
          pip install --quiet billboard.py
          curl -fsSL -o prev-charts.json https://nookiekrizp-sketch.github.io/ReaperOS/charts.json || echo '{}' > prev-charts.json
          python3 tools/charts.py _site/charts.json prev-charts.json
          python3 -c "import json;d=json.load(open('_site/charts.json'));print({k:(len(v['entries']) if isinstance(v,dict) and 'entries' in v else len(v) if isinstance(v,list) else v) for k,v in d.items()})"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
