name: Build ReaperOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ReaperOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReaperOS
          path: ReaperOS.apk

      # A fixed "latest" release, so the download link never changes:
      # https://github.com/<you>/<repo>/releases/download/latest/ReaperOS.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ReaperOS.apk \
            --title "ReaperOS build ${{ github.run_number }}" \
            --notes "Install with the Downloader app on your Fire TV."
