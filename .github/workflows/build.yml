name: Build ReaperOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../android-sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK and Gradle are fetched straight from Google and Gradle,
      # so the build doesn't depend on third-party setup actions.
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && rm tools.zip && mv cmdline-tools latest
          yes | latest/bin/sdkmanager --licenses > /dev/null
          latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build signed APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --warning-mode=none 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -E "error:|^e: |What went wrong|> .*failed|Manifest merger|requires" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ReaperOS.apk

      - uses: actions/upload-artifact@v5
        with:
          name: ReaperOS
          path: ReaperOS.apk

      # A fixed "latest" release, so the download link never changes:
      # https://github.com/<you>/<repo>/releases/download/latest/ReaperOS.apk
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ReaperOS.apk \
            --title "ReaperOS build ${{ github.run_number }}" \
            --notes "Install with the Downloader app on your Fire TV."
