name: Build ReaperOS OS image

# Builds the bootable ReaperOS operating system on top of Bazzite and publishes it to
# ghcr.io/nookiekrizp-sketch/reaperos. Rebuilt daily so Bazzite's updates flow through.
on:
  push:
    branches: [main]
    paths:
      - 'os/**'
      - 'windows/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/os.yml'
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: os-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nookiekrizp-sketch/reaperos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Bazzite is large; make room on the runner first (same step Universal Blue's template uses).
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the ReaperOS app for Linux
        working-directory: windows
        run: |
          npm install --no-audit --no-fund
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          npm run dist:linux
          test -x dist/linux-unpacked/reaperos

      - name: Add the app to the OS files
        run: |
          mkdir -p os/system_files/usr/lib/reaperos
          cp -a windows/dist/linux-unpacked/. os/system_files/usr/lib/reaperos/

      - name: Build the OS image
        run: |
          set -o pipefail
          if ! podman build --pull=newer -f os/Containerfile -t reaperos:latest os 2>&1 | tee build.log; then
            echo "::error title=OS image build failed::$(grep -v '^\s*$' build.log | tail -25 | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Publish to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "build-${{ github.run_number }}"; do
            podman push reaperos:latest "$IMAGE:$tag"
          done
          echo "Published $IMAGE:latest"
