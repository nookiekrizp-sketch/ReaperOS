<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Grill Reaper</title>
<style>
  @font-face { font-family: "ReaperTag"; src: url("fonts/SedgwickAveDisplay-Regular.ttf") format("truetype"); }
  @font-face { font-family: "ReaperDrip"; src: url("fonts/RubikWetPaint-Regular.ttf") format("truetype"); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0B0714; color: #EDE8FA;
    font-family: "Roboto", "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: auto; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 34vh; display: none; pointer-events: none; }
  body.touch #pad { display: block; }
  .dp { position: absolute; width: 17vw; height: 17vw; max-width: 90px; max-height: 90px; border-radius: 22%;
    background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.18); pointer-events: auto;
    display: flex; align-items: center; justify-content: center; font-size: 7vw; color: rgba(255,255,255,.7); }
  .dp.on { background: rgba(34,227,255,.35); }
  #back { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; z-index: 5; border: 0; border-radius: 20px; padding: 7px 14px;
    background: rgba(255,255,255,.14); color: #fff; font-size: 15px; display: none; }
  body.touch #back { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="back">&#8592; ReaperOS</button>
<div id="pad">
  <div class="dp" data-k="ArrowUp" style="left:calc(4vw + 17vw);bottom:calc(4vw + 34vw)">&#9650;</div>
  <div class="dp" data-k="ArrowLeft" style="left:4vw;bottom:calc(4vw + 17vw)">&#9664;</div>
  <div class="dp" data-k="ArrowRight" style="left:calc(4vw + 34vw);bottom:calc(4vw + 17vw)">&#9654;</div>
  <div class="dp" data-k="ArrowDown" style="left:calc(4vw + 17vw);bottom:4vw">&#9660;</div>
  <div class="dp" data-k="Swing" style="right:6vw;bottom:calc(4vw + 12vw);width:24vw;height:24vw;max-width:120px;max-height:120px;border-radius:50%;font-size:5vw">SWING</div>
</div>
<script>
/* Grill Reaper: an original ReaperOS game.
   Walk across each ingredient to knock it down a floor. Stack every burger on its plate to clear the grill.
   Swing the scythe-spatula to stun the sauce bottles and onion rings. Drop food on them for bonus points. */
(function () {
  "use strict";
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var COLS = 28, ROWS = 24, CELL = 24;
  var FLOORS = [3, 7, 11, 15, 19], PLATE_ROW = 22;
  var BURGER_COLS = [2, 9, 16, 23];                       // left column of each 4-wide burger
  var KINDS = {
    top: { h: .75, draw: drawTopBun }, lettuce: { h: .35, draw: drawLettuce }, cheese: { h: .3, draw: drawCheese },
    patty: { h: .55, draw: drawPatty }, tomato: { h: .35, draw: drawTomato }, bottom: { h: .55, draw: drawBottomBun }
  };
  // Level layouts: ladders [col, topRow, bottomRow] and ingredient starts per burger column (top to bottom).
  var LAYOUTS = [
    { ladders: [[0, 3, 19], [7, 3, 11], [7, 15, 19], [14, 3, 7], [14, 11, 19], [13, 7, 11], [20, 3, 15], [21, 15, 19], [27, 3, 19], [5, 11, 15], [24, 7, 11]],
      stacks: [[["top", 0], ["lettuce", 1], ["patty", 2], ["bottom", 3]], [["top", 0], ["patty", 2], ["cheese", 3], ["bottom", 4]],
               [["top", 1], ["tomato", 2], ["patty", 3], ["bottom", 4]], [["top", 0], ["lettuce", 1], ["patty", 3], ["bottom", 4]]] },
    { ladders: [[0, 3, 11], [0, 15, 19], [6, 3, 19], [13, 3, 7], [13, 11, 19], [15, 7, 11], [21, 3, 11], [21, 15, 19], [27, 3, 19], [8, 7, 15], [20, 11, 15]],
      stacks: [[["top", 0], ["cheese", 1], ["patty", 2], ["lettuce", 3], ["bottom", 4]], [["top", 1], ["patty", 2], ["bottom", 3]],
               [["top", 0], ["lettuce", 2], ["patty", 3], ["bottom", 4]], [["top", 0], ["tomato", 1], ["patty", 2], ["cheese", 3], ["bottom", 4]]] }
  ];

  var level, layout, ladderCells, ingredients, plates, player, enemies, held = {}, lastH = 1;
  var score = 0, best = 0, lives = 3, swings = 3, state = "title", stateT = 0, levelNo = 1, paused = false, flash = 0;
  try { best = +localStorage.getItem("grillreaper.best") || 0; } catch (e) {}
  var particles = [];

  function isFloor(r) { return FLOORS.indexOf(r) >= 0; }
  function isLadder(c, r) { return !!(ladderCells[r] && ladderCells[r][c]); }
  function walkable(c, r) { return c >= 0 && c < COLS && (isFloor(r) || isLadder(c, r)); }
  function canMove(c, r, dc, dr) {
    var nc = c + dc, nr = r + dr;
    if (!walkable(nc, nr)) return false;
    if (dr) return isLadder(c, r) && isLadder(nc, nr);
    return isFloor(r) && isFloor(nr);
  }

  function startLevel(n) {
    levelNo = n; layout = LAYOUTS[(n - 1) % LAYOUTS.length];
    ladderCells = {};
    layout.ladders.forEach(function (l) { for (var r = l[1]; r <= l[2]; r++) { (ladderCells[r] = ladderCells[r] || {})[l[0]] = 1; } });
    ingredients = []; plates = BURGER_COLS.map(function () { return []; });
    layout.stacks.forEach(function (stack, k) {
      stack.forEach(function (it) { ingredients.push({ kind: it[0], col: BURGER_COLS[k], k: k, floor: it[1], y: FLOORS[it[1]], steps: [0, 0, 0, 0], falling: false, plated: false, ty: 0 }); });
    });
    swings = Math.min(5, 3 + Math.floor((n - 1) / 2));
    resetActors();
    state = "ready"; stateT = 1.6;
  }
  function resetActors() {
    player = { c: 13, r: FLOORS[4], x: 13, y: FLOORS[4], tc: 13, tr: FLOORS[4], speed: 6.2, face: 1, swingT: 0, dead: 0 };
    var count = Math.min(6, 2 + levelNo), spots = [[0, FLOORS[0]], [27, FLOORS[0]], [0, FLOORS[2]], [27, FLOORS[2]], [27, FLOORS[1]], [0, FLOORS[1]]];
    enemies = [];
    for (var i = 0; i < count; i++) {
      var s = spots[i % spots.length];
      enemies.push({ type: i % 2 ? "ring" : "sauce", c: s[0], r: s[1], x: s[0], y: s[1], tc: s[0], tr: s[1],
        speed: 3.4 + Math.min(2, levelNo * .25) + (i % 3) * .2, stun: 0, wait: i * 1.2, dead: 0 });
    }
  }

  // BFS from the player's cell, so enemies follow the shortest way along floors and ladders.
  var dist = null;
  function computeDist() {
    dist = {}; var q = [[player.tc, player.tr]], key = function (c, r) { return c + "," + r; };
    dist[key(player.tc, player.tr)] = 0;
    while (q.length) {
      var cur = q.shift(), d = dist[key(cur[0], cur[1])];
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (m) {
        if (!canMove(cur[0], cur[1], m[0], m[1])) return;
        var k = key(cur[0] + m[0], cur[1] + m[1]);
        if (dist[k] == null) { dist[k] = d + 1; q.push([cur[0] + m[0], cur[1] + m[1]]); }
      });
    }
  }

  function stepToward(a, dt) {
    var dx = a.tc - a.x, dy = a.tr - a.y, d = Math.abs(dx) + Math.abs(dy), mv = a.speed * dt;
    if (d <= mv) { a.x = a.tc; a.y = a.tr; a.c = a.tc; a.r = a.tr; return mv - d; }
    a.x += Math.sign(dx) * Math.min(mv, Math.abs(dx)); a.y += Math.sign(dy) * Math.min(mv, Math.abs(dy));
    return 0;
  }

  function updatePlayer(dt) {
    if (player.swingT > 0) player.swingT -= dt;
    var left = stepToward(player, dt);
    if (player.x !== player.tc || player.y !== player.tr) return;
    stepIngredients();
    var want = held.ArrowUp ? [0, -1] : held.ArrowDown ? [0, 1] : held.ArrowLeft ? [-1, 0] : held.ArrowRight ? [1, 0] : null;
    if (!want) return;
    var c = player.c, r = player.r;
    if (canMove(c, r, want[0], want[1])) { player.tc = c + want[0]; player.tr = r + want[1]; }
    else if (want[1] && isFloor(r) && (held.ArrowUp || held.ArrowDown)) {
      // holding up/down off a ladder: slide toward the nearest ladder on this floor
      var best = null;
      for (var dc = 1; dc < 4 && best == null; dc++) {
        [c - dc, c + dc].forEach(function (x) { if (best == null && isLadder(x, r) && isLadder(x, r + want[1])) best = x; });
      }
      if (best != null && canMove(c, r, Math.sign(best - c), 0)) player.tc = c + Math.sign(best - c);
    }
    if (want[0]) { player.face = want[0]; lastH = want[0]; }
    if (left > 0 && (player.tc !== c || player.tr !== r)) stepToward(player, left / player.speed);
  }

  function stepIngredients() {
    if (!isFloor(player.r)) return;
    ingredients.forEach(function (ing) {
      if (ing.falling || ing.plated || ing.y !== player.r) return;
      var seg = player.c - ing.col;
      if (seg < 0 || seg > 3 || ing.steps[seg]) return;
      ing.steps[seg] = 1; score += 10;
      if (ing.steps.every(Boolean)) dropIngredient(ing, 1);
    });
  }
  function dropIngredient(ing, riders) {
    ing.falling = true; ing.steps = [0, 0, 0, 0];
    var fi = FLOORS.indexOf(ing.y);
    if (fi < FLOORS.length - 1) { ing.ty = FLOORS[fi + 1]; ing.toPlate = false; }
    else { ing.ty = PLATE_ROW - plates[ing.k].length * .62; ing.toPlate = true; }
    score += 50;
  }
  function updateIngredients(dt) {
    ingredients.forEach(function (ing) {
      if (!ing.falling) return;
      var oldY = ing.y; ing.y = Math.min(ing.ty, ing.y + 13 * dt);
      enemies.forEach(function (e) {                         // squash anything underneath
        if (e.dead) return;
        if (e.x > ing.col - .5 && e.x < ing.col + 3.5 && e.y > oldY - .2 && e.y <= ing.y + .3 && e.y > oldY) {
          e.dead = 4; score += 500; burst(e.x, e.y, "#FF5A2A");
        }
      });
      if (ing.y < ing.ty) return;
      ing.falling = false;
      if (ing.toPlate) { ing.plated = true; plates[ing.k].push(ing); burst(ing.col + 2, ing.y, "#E8C24A"); checkWin(); return; }
      var under = ingredients.filter(function (o) { return o !== ing && !o.falling && !o.plated && o.k === ing.k && o.y === ing.y; })[0];
      if (under) dropIngredient(under);                      // knock the one below down too
    });
  }
  function checkWin() {
    if (ingredients.every(function (i) { return i.plated; })) { state = "clear"; stateT = 2.4; score += 1000; burst(14, 12, "#22E3FF", 40); }
  }

  function updateEnemies(dt) {
    computeDist();
    enemies.forEach(function (e) {
      if (e.dead) { e.dead -= dt; if (e.dead <= 0) { e.dead = 0; var s = Math.random() < .5 ? 0 : 27; e.c = e.tc = e.x = s; e.r = e.tr = e.y = FLOORS[0]; e.wait = 1; } return; }
      if (e.wait > 0) { e.wait -= dt; return; }
      if (e.stun > 0) { e.stun -= dt; return; }
      stepToward(e, dt);
      if (e.x !== e.tc || e.y !== e.tr) return;
      var opts = [];
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (m) {
        if (!canMove(e.c, e.r, m[0], m[1])) return;
        var d = dist[(e.c + m[0]) + "," + (e.r + m[1])]; if (d == null) d = 999;
        if (e.back && m[0] === -e.back[0] && m[1] === -e.back[1]) d += .5;   // avoid dithering back and forth
        opts.push({ m: m, d: d + (Math.random() < .12 ? Math.random() * 6 : 0) });
      });
      opts.sort(function (a, b) { return a.d - b.d; });
      if (opts[0]) { e.tc = e.c + opts[0].m[0]; e.tr = e.r + opts[0].m[1]; e.back = opts[0].m; }
    });
  }

  function swing() {
    if (state !== "play" || player.swingT > 0) return;
    if (swings <= 0) { flash = .3; return; }
    swings--; player.swingT = .35;
    enemies.forEach(function (e) {
      if (e.dead) return;
      var dx = e.x - player.x, dy = Math.abs(e.y - player.y);
      if (dy < 1.2 && dx * player.face > -.5 && Math.abs(dx) < 4.2) { e.stun = 3.2; score += 100; burst(e.x, e.y, "#B9A6E0", 10); }
    });
  }

  function checkCatch() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.dead || e.stun > 0 || e.wait > 0) continue;
      if (Math.abs(e.x - player.x) < .7 && Math.abs(e.y - player.y) < .7) {
        lives--; state = "caught"; stateT = 2; burst(player.x, player.y, "#FF3A1C", 24); return;
      }
    }
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < (n || 14); i++) particles.push({ x: x, y: y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 7, t: .8 + Math.random() * .5, c: color });
  }

  // ------------------------------------------------------------------ drawing
  function px(v) { return v * CELL; }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function drawTopBun(x, y, w) {
    var g = ctx.createLinearGradient(0, y - CELL * .7, 0, y); g.addColorStop(0, "#F2B35A"); g.addColorStop(1, "#B8691F");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x, y - CELL * .85, x + w / 2, y - CELL * .85); ctx.quadraticCurveTo(x + w, y - CELL * .85, x + w, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#FFF3D6"; for (var i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(x + w * (.18 + i * .13), y - CELL * (.45 + (i % 2) * .15), 2.2, 1.2, .4, 0, 6.3); ctx.fill(); }
  }
  function drawLettuce(x, y, w) {
    ctx.fillStyle = "#4FC24A"; ctx.beginPath(); ctx.moveTo(x - 3, y);
    for (var i = 0; i <= 10; i++) ctx.lineTo(x - 3 + (w + 6) * i / 10, y - CELL * (i % 2 ? .38 : .18));
    ctx.lineTo(x + w + 3, y + 2); ctx.closePath(); ctx.fill();
  }
  function drawCheese(x, y, w) {
    ctx.fillStyle = "#F7C928"; ctx.beginPath(); ctx.moveTo(x - 2, y - CELL * .3); ctx.lineTo(x + w + 2, y - CELL * .3); ctx.lineTo(x + w + 2, y);
    ctx.lineTo(x + w * .7, y); ctx.lineTo(x + w * .62, y + CELL * .25); ctx.lineTo(x + w * .54, y); ctx.lineTo(x + w * .25, y); ctx.lineTo(x + w * .18, y + CELL * .2); ctx.lineTo(x + w * .1, y); ctx.lineTo(x - 2, y); ctx.closePath(); ctx.fill();
  }
  function drawTomato(x, y, w) {
    ctx.fillStyle = "#E0372C"; for (var i = 0; i < 3; i++) { roundRect(x + i * w / 3 + 1, y - CELL * .35, w / 3 - 2, CELL * .35, 4); ctx.fill(); }
    ctx.fillStyle = "#F7A08F"; for (i = 0; i < 3; i++) { ctx.fillRect(x + i * w / 3 + w / 6 - 3, y - CELL * .22, 6, 2); }
  }
  function drawPatty(x, y, w) {
    ctx.fillStyle = "#5A3218"; roundRect(x - 2, y - CELL * .55, w + 4, CELL * .55, 7); ctx.fill();
    ctx.strokeStyle = "#2E180A"; ctx.lineWidth = 2;
    for (var i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(x + w * i / 6, y - CELL * .5); ctx.lineTo(x + w * i / 6 - 4, y - CELL * .08); ctx.stroke(); }
  }
  function drawBottomBun(x, y, w) {
    ctx.fillStyle = "#C97A2C"; roundRect(x, y - CELL * .55, w, CELL * .55, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(x + 4, y - CELL * .5, w - 8, 3);
  }

  function drawIngredient(ing) {
    var x = px(ing.col), w = px(4), baseY = px(ing.y) + CELL * .5 - 1;
    ctx.save();
    for (var s = 0; s < 4; s++) {
      ctx.save();
      ctx.beginPath(); ctx.rect(x + s * CELL - 4 + (s === 0 ? -4 : 0), 0, CELL + (s === 0 || s === 3 ? 8 : 0), cv.height); ctx.clip();
      ctx.translate(0, ing.steps[s] ? 5 : 0);
      KINDS[ing.kind].draw(x, baseY, w);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawReaper(p, t) {
    var x = px(p.x) + CELL / 2, y = px(p.y) + CELL / 2, f = p.face, bob = Math.sin(t * 14) * ((p.x !== p.tc || p.y !== p.tr) ? 1.6 : 0);
    ctx.save(); ctx.translate(x, y + bob);
    // scythe-spatula
    ctx.save(); ctx.translate(f * 9, -6); ctx.rotate(f * (p.swingT > 0 ? -1.6 + (1 - p.swingT / .35) * 2.6 : -.35));
    ctx.strokeStyle = "#5A3E26"; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(0, -16); ctx.stroke();
    ctx.fillStyle = "#C9C0DD"; ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(f * 14, -22, f * 18, -10); ctx.quadraticCurveTo(f * 10, -15, 0, -12); ctx.fill();
    ctx.restore();
    // robe
    ctx.fillStyle = "#140C24"; ctx.strokeStyle = "rgba(205,190,255,.7)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.bezierCurveTo(9, -16, 11, -6, 11, 2); ctx.lineTo(13, 13); ctx.lineTo(7, 10); ctx.lineTo(3, 14); ctx.lineTo(-2, 10); ctx.lineTo(-7, 14); ctx.lineTo(-13, 12);
    ctx.lineTo(-11, 2); ctx.bezierCurveTo(-11, -6, -9, -16, 0, -16); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.ellipse(f * 1.5, -5, 6.5, 7.5, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = "rgba(200,190,215,.75)"; ctx.beginPath(); ctx.ellipse(f * 1.5, -6, 4.6, 5, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = "#FF3A1C"; ctx.beginPath(); ctx.arc(f * 1.5 - 2, -6.5, 1.3, 0, 6.3); ctx.arc(f * 1.5 + 2, -6.5, 1.3, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  function drawEnemy(e, t) {
    var x = px(e.x) + CELL / 2, y = px(e.y) + CELL / 2, wob = Math.sin(t * 10 + e.speed * 9) * 2;
    ctx.save(); ctx.translate(x, y);
    if (e.dead) { ctx.globalAlpha = Math.max(0, Math.min(1, e.dead - 3)); ctx.scale(1.4, .3); }
    if (e.stun > 0) { ctx.rotate(Math.sin(t * 18) * .3); }
    if (e.type === "sauce") {
      ctx.fillStyle = "#D8261B"; roundRect(-7, -9 + wob * .3, 14, 22, 4); ctx.fill();
      ctx.fillStyle = "#F4F0E8"; ctx.fillRect(-4, -15 + wob * .3, 8, 6);
      ctx.fillStyle = "#2B7A2B"; ctx.fillRect(-3, -18 + wob * .3, 6, 3);
      ctx.fillStyle = "#FFE8C2"; roundRect(-6, -1, 12, 7, 2); ctx.fill();
    } else {
      ctx.strokeStyle = "#E3A944"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(0, wob * .3, 10, 11, 0, 0, 6.3); ctx.stroke();
      ctx.strokeStyle = "#F7D27A"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(0, wob * .3, 10, 11, 0, 3.6, 5.6); ctx.stroke();
    }
    // angry eyes (spirals when stunned)
    ctx.fillStyle = "#000"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.4;
    if (e.stun > 0) { [-3, 3].forEach(function (ex) { ctx.beginPath(); ctx.arc(ex, -3, 2, 0, 5); ctx.stroke(); }); }
    else {
      ctx.beginPath(); ctx.arc(-3, -2, 1.6, 0, 6.3); ctx.arc(3, -2, 1.6, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-1, -4); ctx.moveTo(6, -6); ctx.lineTo(1, -4); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    var g = ctx.createLinearGradient(0, 0, 0, cv.height); g.addColorStop(0, "#160B2B"); g.addColorStop(1, "#0B0714");
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    // moon
    ctx.fillStyle = "rgba(214,203,242,.12)"; ctx.beginPath(); ctx.arc(px(23), px(1.4), px(1.6), 0, 6.3); ctx.fill();
    // bone ladders
    layout.ladders.forEach(function (l) {
      var x = px(l[0]) + CELL / 2, y0 = px(l[1]) + CELL / 2, y1 = px(l[2]) + CELL / 2;
      ctx.strokeStyle = "#CFC6D8"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x - 8, y0); ctx.lineTo(x - 8, y1); ctx.moveTo(x + 8, y0); ctx.lineTo(x + 8, y1); ctx.stroke();
      ctx.lineWidth = 3; for (var y = y0 + 6; y < y1; y += 9) { ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.stroke(); }
    });
    // girders: dark iron with violet edge
    FLOORS.forEach(function (r) {
      var y = px(r) + CELL / 2 + 1;
      ctx.fillStyle = "#2A1A4A"; ctx.fillRect(0, y, cv.width, 6);
      ctx.fillStyle = "#8B5CF6"; ctx.fillRect(0, y, cv.width, 1.5);
      ctx.fillStyle = "rgba(0,0,0,.35)"; for (var x = 0; x < cv.width; x += 18) ctx.fillRect(x, y + 2, 2, 4);
    });
    // plates
    BURGER_COLS.forEach(function (c) {
      var y = px(PLATE_ROW) + CELL / 2 + 2;
      ctx.fillStyle = "#E8E4F2"; ctx.beginPath(); ctx.ellipse(px(c + 2), y + 3, px(2.5), 5, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = "#B9A6E0"; ctx.beginPath(); ctx.ellipse(px(c + 2), y + 2, px(2), 3, 0, 0, 6.3); ctx.fill();
    });
    ingredients.forEach(drawIngredient);
    enemies.forEach(function (e) { drawEnemy(e, t); });
    if (state !== "caught" || Math.floor(t * 10) % 2) drawReaper(player, t);
    particles.forEach(function (p) { ctx.globalAlpha = Math.max(0, p.t); ctx.fillStyle = p.c; ctx.fillRect(px(p.x) + CELL / 2, px(p.y) + CELL / 2, 3, 3); });
    ctx.globalAlpha = 1;
    // HUD
    ctx.fillStyle = "rgba(11,7,20,.75)"; ctx.fillRect(0, 0, cv.width, px(2));
    ctx.font = "800 " + Math.round(CELL * .75) + "px system-ui, sans-serif"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#22E3FF"; ctx.textAlign = "left"; ctx.fillText("SCORE " + score, px(.6), px(1));
    ctx.textAlign = "center"; ctx.fillStyle = "#EDE8FA"; ctx.fillText("LEVEL " + levelNo + "   BEST " + Math.max(best, score), cv.width / 2, px(1));
    ctx.textAlign = "right"; ctx.fillStyle = flash > 0 ? "#FF3A1C" : "#B9A6E0";
    ctx.fillText("☠".repeat(Math.max(0, lives)) + "   SWINGS " + swings, cv.width - px(.6), px(1));
    if (state !== "play" || paused) overlay(t);
  }
  function overlay(t) {
    var title = "", sub = "";
    if (state === "title") { title = "Grill Reaper"; sub = "Walk over food to drop it · stack every burger · " + (touch ? "SWING" : "OK / Space") + " stuns the sauce"; }
    else if (state === "ready") { title = "Level " + levelNo; sub = "Get ready"; }
    else if (state === "clear") { title = "Order up!"; sub = "+1000"; }
    else if (state === "over") { title = "Game over"; sub = "Score " + score + " · " + (touch ? "tap SWING" : "press OK") + " to play again"; }
    else if (paused) { title = "Paused"; sub = "Press play/pause or OK to continue"; }
    else return;
    ctx.fillStyle = "rgba(11,7,20,.72)"; ctx.fillRect(0, cv.height * .34, cv.width, cv.height * .26);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = Math.round(CELL * 2.6) + "px ReaperDrip, ReaperTag, system-ui"; ctx.fillStyle = "#EDE8FA";
    ctx.fillText(title, cv.width / 2, cv.height * .43);
    ctx.font = "600 " + Math.round(CELL * .7) + "px system-ui, sans-serif"; ctx.fillStyle = "#B9A6E0";
    ctx.fillText(sub, cv.width / 2, cv.height * .53);
  }

  // ------------------------------------------------------------------ loop
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(.05, (now - last) / 1000); last = now; var t = now / 1000;
    if (flash > 0) flash -= dt;
    particles.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 14 * dt; p.t -= dt; });
    particles = particles.filter(function (p) { return p.t > 0; });
    if (!paused) {
      if (state === "play") { updatePlayer(dt); updateIngredients(dt); updateEnemies(dt); checkCatch(); }
      else if (state === "ready") { stateT -= dt; if (stateT <= 0) state = "play"; }
      else if (state === "clear") { updateIngredients(dt); stateT -= dt; if (stateT <= 0) startLevel(levelNo + 1); }
      else if (state === "caught") {
        stateT -= dt;
        if (stateT <= 0) {
          if (lives <= 0) { state = "over"; if (score > best) { best = score; try { localStorage.setItem("grillreaper.best", best); } catch (e) {} } }
          else { resetActors(); state = "ready"; stateT = 1.2; }
        }
      }
    }
    draw(t);
  }

  function fit() {
    var availW = window.innerWidth, availH = window.innerHeight * (touch ? .64 : 1);
    var s = Math.min(availW / (COLS * 24), availH / (ROWS * 24));
    CELL = Math.max(10, Math.floor(24 * s));
    cv.width = COLS * CELL; cv.height = ROWS * CELL;
    document.getElementById("wrap").style.alignItems = touch ? "flex-start" : "center";
    document.getElementById("wrap").style.paddingTop = touch ? "max(44px, env(safe-area-inset-top))" : "0";
  }

  // ------------------------------------------------------------------ input
  function press(k) {
    if (k === "Back") { exit(); return; }
    if (k === "PlayPause") { if (state === "play") paused = !paused; return; }
    if (k === "Swing") {
      if (paused) { paused = false; return; }
      if (state === "title" || state === "over") { score = 0; lives = 3; startLevel(1); return; }
      swing(); return;
    }
    if (/^Arrow/.test(k)) held[k] = true;
  }
  function release(k) { if (/^Arrow/.test(k)) held[k] = false; }
  function exit() { location.href = "index.html?resume=1"; }

  // Fire TV remote (keys come from the ReaperOS app)
  window.reaperKey = function (name, repeat) {
    if (repeat) return true;
    var k = name === "Enter" || name === "Menu" || name === "X" ? "Swing" : name;
    press(k); return true;
  };
  window.reaperKeyUp = function (name) { release(name); };
  // keyboard
  var KEYS = { ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", w: "ArrowUp", s: "ArrowDown", a: "ArrowLeft", d: "ArrowRight",
    " ": "Swing", Enter: "Swing", x: "Swing", Escape: "Back", Backspace: "Back", p: "PlayPause", MediaPlayPause: "PlayPause" };
  document.addEventListener("keydown", function (e) { var k = KEYS[e.key]; if (!k) return; e.preventDefault(); if (!e.repeat) press(k); });
  document.addEventListener("keyup", function (e) { var k = KEYS[e.key]; if (k) release(k); });
  // controllers
  var padPrev = {};
  (function pollPads() {
    requestAnimationFrame(pollPads);
    var pads = navigator.getGamepads ? navigator.getGamepads() : []; var p = null;
    for (var i = 0; i < pads.length; i++) if (pads[i]) { p = pads[i]; break; }
    if (!p) return;
    var ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = p.buttons;
    var st = { ArrowUp: (b[12] && b[12].pressed) || ay < -.5, ArrowDown: (b[13] && b[13].pressed) || ay > .5,
      ArrowLeft: (b[14] && b[14].pressed) || ax < -.5, ArrowRight: (b[15] && b[15].pressed) || ax > .5,
      Swing: (b[0] && b[0].pressed) || (b[2] && b[2].pressed), Back: b[1] && b[1].pressed, PlayPause: b[9] && b[9].pressed };
    Object.keys(st).forEach(function (k) { if (st[k] && !padPrev[k]) press(k); if (!st[k] && padPrev[k]) release(k); padPrev[k] = st[k]; });
  })();
  // touch
  var touch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  if (touch) document.body.classList.add("touch");
  Array.prototype.forEach.call(document.querySelectorAll(".dp"), function (b) {
    var k = b.dataset.k;
    b.addEventListener("touchstart", function (e) { e.preventDefault(); b.classList.add("on"); press(k); }, { passive: false });
    b.addEventListener("touchend", function (e) { e.preventDefault(); b.classList.remove("on"); release(k); }, { passive: false });
    b.addEventListener("touchcancel", function () { b.classList.remove("on"); release(k); });
  });
  document.getElementById("back").addEventListener("click", exit);
  cv.addEventListener("click", function () { if (!touch && (state === "title" || state === "over")) press("Swing"); });

  window.addEventListener("resize", fit);
  fit();
  startLevel(1); state = "title";
  requestAnimationFrame(frame);
  window.__grill = { state: function () { return state; }, score: function () { return score; }, player: function () { return player; }, ingredients: function () { return ingredients; }, enemies: function () { return enemies; } };
})();
</script>
</body>
